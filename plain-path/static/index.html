<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14575f">
  <title>Plain Path</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="skip">Skip to main content</a>

  <header class="site-header">
    <div class="wrap header-row">
      <div>
        <p class="brand">Plain Path</p>
        <p class="tagline" data-i18n="tagline">An AI helper for understanding unemployment forms</p>
      </div>
      <div class="lang-toggle" role="group" aria-label="Language / Idioma">
        <button type="button" data-lang="en" lang="en" aria-pressed="true">English</button>
        <button type="button" data-lang="es" lang="es" aria-pressed="false">Español</button>
      </div>
    </div>
  </header>

  <!-- Each screen is drawn inside <main> by app.js. tabindex lets us move focus here. -->
  <main id="main" class="wrap" tabindex="-1">
    <p data-i18n="loading">Loading…</p>
    <noscript><p>Plain Path needs JavaScript turned on to work.</p></noscript>
  </main>

  <!-- The disclaimer is part of the page itself, so it shows on every screen. -->
  <footer class="site-footer">
    <div class="wrap">
      <p data-i18n="disclaimer">Plain Path is a student prototype, not legal advice and not affiliated with Arizona DES.</p>
    </div>
  </footer>

  <script src="/static/i18n.js"></script>
  <script src="/static/ssn_guard.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
